<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mercaso Reports Login</title>
    <style>
      :root {
        color-scheme: light;
        --report-purple: #542c8f;
        --report-purple-strong: #40206f;
        --report-purple-soft: rgb(84 44 143 / 0.12);
        --report-sidebar: #160d22;
        --report-sidebar-raised: #24182f;
        --page-bg: #edf0f4;
        --page-bg-elevated: #f6f7f9;
        --surface-bg: #ffffff;
        --surface-bg-strong: #fffcf7;
        --surface-border: rgb(30 23 43 / 0.11);
        --surface-border-strong: rgb(30 23 43 / 0.18);
        --text-primary: #17131f;
        --text-secondary: #514b5f;
        --text-muted: #776f85;
        --info: #3176d3;
        --info-soft: rgb(49 118 211 / 0.12);
        --shadow-card:
          0 1px 2px rgb(15 23 42 / 0.05),
          0 18px 52px rgb(15 23 42 / 0.12);
        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 10px;
        --font-body:
          "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", system-ui, sans-serif;
        --font-display:
          Lexend, "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--page-bg);
        color: var(--text-primary);
        font-family: var(--font-body);
        line-height: 1.5;
        letter-spacing: 0;
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .board {
        min-height: 100vh;
        padding: 28px;
      }

      .boardHeader {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        max-width: 1440px;
        margin: 0 auto 18px;
      }

      .boardHeader h1 {
        margin: 0;
        font-family: var(--font-display);
        font-size: 24px;
        font-weight: 650;
        line-height: 1.2;
      }

      .boardHeader p {
        margin: 6px 0 0;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .boardMeta {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
      }

      .metaChip {
        display: inline-flex;
        align-items: center;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-sm);
        background: var(--surface-bg);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 700;
      }

      .previewFrame {
        overflow: hidden;
        max-width: 1440px;
        margin: 0 auto;
        border: 1px solid var(--surface-border-strong);
        border-radius: 12px;
        background: var(--surface-bg);
        box-shadow: var(--shadow-card);
      }

      .frameBar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 40px;
        padding: 0 14px;
        border-bottom: 1px solid var(--surface-border);
        background: var(--page-bg-elevated);
      }

      .frameTitle {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 750;
      }

      .windowDots {
        display: flex;
        gap: 6px;
      }

      .windowDots span {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #c8ced8;
      }

      .loginPage {
        display: grid;
        grid-template-columns: minmax(0, 1fr) clamp(424px, 30vw, 440px);
        min-height: 720px;
        background:
          linear-gradient(180deg, rgb(255 252 247 / 0.86), transparent 42%),
          var(--page-bg);
      }

      .visualPane {
        position: relative;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
        overflow: hidden;
        padding: 28px;
        background:
          radial-gradient(circle at 22% 18%, rgb(84 44 143 / 0.14), transparent 30%),
          linear-gradient(135deg, #f8f7f3, #eef1f5 58%, #e6e9ef);
        border-right: 1px solid var(--surface-border);
      }

      .visualPane::before {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgb(30 23 43 / 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgb(30 23 43 / 0.045) 1px, transparent 1px);
        background-size: 44px 44px;
        mask-image: linear-gradient(180deg, rgb(0 0 0 / 0.78), transparent 74%);
        content: "";
        pointer-events: none;
      }

      .brandLockup {
        position: relative;
        z-index: 1;
      }

      .brandLockup {
        display: grid;
        grid-template-columns: 40px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }

      .brandMark {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border: 1px solid rgb(255 255 255 / 0.18);
        border-radius: var(--radius-md);
        background: var(--report-purple);
        color: #fff;
        font-size: 14px;
        font-weight: 800;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.16);
      }

      .brandLockup h2 {
        margin: 0;
        color: var(--text-primary);
        font-family: var(--font-display);
        font-size: 17px;
        font-weight: 650;
        line-height: 1.18;
      }

      .visualReserve {
        position: relative;
        z-index: 1;
        place-self: center;
        width: min(100%, 680px);
        min-height: 360px;
        display: grid;
        align-content: center;
        gap: 18px;
        padding: 36px;
        border: 1px dashed rgb(84 44 143 / 0.22);
        border-radius: var(--radius-lg);
        background: rgb(255 255 255 / 0.42);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.64);
      }

      .reserveEyebrow {
        margin: 0;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .visualReserve h1 {
        max-width: 12ch;
        margin: 0;
        color: var(--text-primary);
        font-family: var(--font-display);
        font-size: 48px;
        font-weight: 680;
        line-height: 1.02;
      }

      .placeholderLine {
        width: min(100%, 440px);
        height: 10px;
        border-radius: 999px;
        background: rgb(84 44 143 / 0.1);
      }

      .placeholderLine.short {
        width: 280px;
        background: rgb(47 141 131 / 0.12);
      }

      .authPane {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-width: 0;
        padding: 28px;
        background: var(--surface-bg);
      }

      .authTop {
        display: flex;
        justify-content: flex-end;
      }

      .topbarLink {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 36px;
        padding: 0 11px;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        background: var(--page-bg-elevated);
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 750;
      }

      .authCenter {
        display: grid;
        place-items: center;
        padding: 34px 0;
      }

      .authPanel {
        width: min(100%, 376px);
      }

      .authHeader {
        margin-bottom: 18px;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--text-muted);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .authHeader h3 {
        margin: 0;
        color: var(--text-primary);
        font-family: var(--font-display);
        font-size: 28px;
        font-weight: 650;
        line-height: 1.2;
      }

      .authHeader p {
        margin: 9px 0 0;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .authCard {
        display: grid;
        gap: 16px;
        padding: 20px;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-lg);
        background: var(--surface-bg);
        box-shadow: var(--shadow-card);
      }

      .segment {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3px;
        padding: 3px;
        border: 1px solid var(--surface-border);
        border-radius: var(--radius-md);
        background: var(--page-bg-elevated);
      }

      .segment button {
        min-height: 36px;
        border: 0;
        border-radius: var(--radius-sm);
        background: transparent;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 750;
      }

      .segment .active {
        background: var(--surface-bg);
        color: var(--report-purple-strong);
        box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
      }

      .form {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 7px;
      }

      .labelRow {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      label {
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 750;
      }

      .fieldLink {
        color: var(--report-purple-strong);
        font-size: 12px;
        font-weight: 750;
      }

      .inputWrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        min-height: 44px;
        border: 1px solid var(--surface-border-strong);
        border-radius: var(--radius-md);
        background: var(--surface-bg);
      }

      .inputWrap input {
        min-width: 0;
        height: 42px;
        border: 0;
        padding: 0 12px;
        background: transparent;
        color: var(--text-primary);
        outline: 0;
      }

      .inputAction {
        min-width: 44px;
        height: 42px;
        border: 0;
        border-left: 1px solid var(--surface-border);
        background: transparent;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 800;
      }

      .helper {
        margin: 0;
        color: var(--text-muted);
        font-size: 12px;
      }

      .primaryButton,
      .googleButton {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 14px;
        border-radius: var(--radius-md);
        font-size: 14px;
        font-weight: 800;
      }

      .primaryButton {
        border: 1px solid var(--report-purple);
        background: var(--report-purple);
        color: #fff;
      }

      .googleButton {
        gap: 10px;
        border: 1px solid var(--surface-border-strong);
        background: var(--surface-bg);
        color: var(--text-primary);
      }

      .googleButton svg {
        flex: 0 0 auto;
        width: 18px;
        height: 18px;
      }

      .divider {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 10px;
        align-items: center;
        color: var(--text-muted);
        font-size: 12px;
      }

      .divider::before,
      .divider::after {
        height: 1px;
        background: var(--surface-border);
        content: "";
      }

      .authFoot {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px 14px;
        color: var(--text-muted);
        font-size: 12px;
      }

      .footDot {
        width: 4px;
        height: 4px;
        margin-top: 7px;
        border-radius: 999px;
        background: #b9bfca;
      }

      @media (max-width: 980px) {
        .loginPage {
          grid-template-columns: 1fr;
        }

        .visualPane {
          min-height: 320px;
          border-right: 0;
          border-bottom: 1px solid var(--surface-border);
        }

        .visualReserve {
          min-height: 220px;
        }
      }

      @media (max-width: 720px) {
        .board {
          padding: 16px;
        }

        .boardHeader {
          display: grid;
          align-items: start;
        }

        .boardMeta {
          justify-content: flex-start;
        }

        .visualPane,
        .authPane {
          padding: 18px;
        }

        .visualReserve h1 {
          font-size: 32px;
        }

        .authHeader h3 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="board">
      <header class="boardHeader">
        <div>
          <h1>登录页方案 / Mercaso Reports</h1>
          <p>左右布局：左侧预留大面积品牌视觉区，右侧提供账号登录和 Google 授权。</p>
        </div>
        <div class="boardMeta" aria-label="Design constraints">
          <span class="metaChip">品牌视觉区</span>
          <span class="metaChip">账号登录</span>
          <span class="metaChip">Google 授权</span>
        </div>
      </header>

      <article class="previewFrame">
        <div class="frameBar">
          <span class="frameTitle">方案：独立登录页 / 左右分栏</span>
          <span class="windowDots" aria-hidden="true"><span></span><span></span><span></span></span>
        </div>

        <div class="loginPage">
          <section class="visualPane" aria-label="Brand visual reserve">
            <div class="brandLockup">
              <div class="brandMark">R</div>
              <div>
                <h2>Mercaso Reports</h2>
              </div>
            </div>

            <div class="visualReserve">
              <p class="reserveEyebrow">Workspace entry</p>
              <h1>从这里进入报表工作区。</h1>
              <span class="placeholderLine"></span>
              <span class="placeholderLine short"></span>
            </div>

          </section>

          <section class="authPane" aria-label="Login form">
            <div class="authTop">
              <a class="topbarLink" href="#">联系管理员</a>
            </div>

            <div class="authCenter">
              <div class="authPanel">
                <header class="authHeader">
                  <p class="eyebrow">Workspace access</p>
                  <h3>登录工作区</h3>
                  <p>使用已开通的工作区账号继续访问报表与数据源。</p>
                </header>

                <div class="authCard">
                  <div class="segment" role="tablist" aria-label="Login method">
                    <button class="active" type="button">账号登录</button>
                    <button type="button">Google</button>
                  </div>

                  <form class="form">
                    <div class="field">
                      <label for="email-a">邮箱或用户名</label>
                      <div class="inputWrap">
                        <input id="email-a" value="analyst@mercaso.com" />
                      </div>
                    </div>

                    <div class="field">
                      <div class="labelRow">
                        <label for="password-a">密码</label>
                        <a class="fieldLink" href="#">忘记密码？</a>
                      </div>
                      <div class="inputWrap">
                        <input id="password-a" type="password" value="dashboard" />
                        <button class="inputAction" type="button" aria-label="显示密码">显示</button>
                      </div>
                      <p class="helper">密码由工作区管理员或企业身份系统管理。</p>
                    </div>

                    <button class="primaryButton" type="button">登录工作区</button>
                  </form>

                  <div class="divider">或</div>

                  <button class="googleButton" type="button">
                    <svg viewBox="0 0 18 18" aria-hidden="true">
                      <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.25h2.92c1.7-1.57 2.68-3.88 2.68-6.6z" />
                      <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.2l-2.92-2.25c-.8.54-1.84.86-3.04.86a5.35 5.35 0 0 1-5.03-3.7H.96v2.32A9 9 0 0 0 9 18z" />
                      <path fill="#FBBC05" d="M3.97 10.71A5.4 5.4 0 0 1 3.69 9c0-.59.1-1.16.28-1.71V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.03l3.01-2.32z" />
                      <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.34l2.58-2.58A8.65 8.65 0 0 0 9 0 9 9 0 0 0 .96 4.97l3.01 2.32A5.35 5.35 0 0 1 9 3.58z" />
                    </svg>
                    使用 Google 授权
                  </button>
                </div>
              </div>
            </div>

            <footer class="authFoot">
              <span>© 2026 Mercaso</span>
              <span class="footDot"></span>
              <span>安全访问</span>
              <span class="footDot"></span>
              <span>工作区权限受控</span>
            </footer>
          </section>
        </div>
      </article>
    </main>
  </body>
</html>
